<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Document Cortex</title>
<style>
/* Layout: sidebar (projects, chats) | main (chat or library) | panel (source, outline, process).
   Phone: sidebar becomes a drawer, panel a full-screen sheet. Index-card motif for sources. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --raise:#ffffff; --ink:#15201d; --muted:#5b6964; --faint:#8a9792; --line:#d9e0dd; --soft:#e8eeeb; --hover:#eef3f1;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --cite:#8a5a00; --cite-soft:#fbefd2; --warn:#a33a2a; --warn-soft:#fbe3df; --ok:#226b3a; --ok-soft:#e0f1e5;
  --card:#fbfbf8; --shadow:0 10px 30px rgba(16,32,28,.14); --scrim:rgba(10,20,17,.35);
  --serif:"Charter","Iowan Old Style","Source Serif Pro","Noto Serif","Noto Serif Devanagari",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --panel:#131b18; --raise:#1a2420; --ink:#e3ece8; --muted:#97a7a1; --faint:#6f7f79; --line:#28342f; --soft:#1c2622; --hover:#1a2420;
  --accent:#4fc2a6; --accent-ink:#06201a; --accent-soft:#17312a;
  --cite:#f0c060; --cite-soft:#33280f; --warn:#f08a78; --warn-soft:#3a1d18; --ok:#7bd193; --ok-soft:#17301f;
  --card:#18211e; --shadow:0 12px 34px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1412; --panel:#131b18; --raise:#1a2420; --ink:#e3ece8; --muted:#97a7a1; --faint:#6f7f79; --line:#28342f; --soft:#1c2622; --hover:#1a2420;
  --accent:#4fc2a6; --accent-ink:#06201a; --accent-soft:#17312a;
  --cite:#f0c060; --cite-soft:#33280f; --warn:#f08a78; --warn-soft:#3a1d18; --ok:#7bd193; --ok-soft:#17301f;
  --card:#18211e; --shadow:0 12px 34px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.app.panel-open{grid-template-columns:272px minmax(0,1fr) 420px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--warn);border-color:var(--warn-soft)}
.btn.danger.solid{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg,.btn svg,.nav svg{width:16px;height:16px;flex:none}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--panel)}

/* ---------- sidebar ---------- */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:9px;padding:14px 12px 10px 16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo svg{width:16px;height:16px}
.brand h1{font:600 17px/1.1 var(--serif);margin:0;flex:1;letter-spacing:.01em}
.rail-close{display:none}
.newchat{margin:2px 12px 8px;justify-content:space-between}
.newchat span{display:flex;gap:7px;align-items:center}
.search{margin:0 12px 8px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px 6px 30px;font-size:13.5px;outline:0}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.rail-scroll{flex:1;overflow:auto;padding:0 8px 10px;min-height:0}
.sec{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px;color:var(--faint);font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em}
.sec .ib{width:24px;height:24px}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:8px;font-size:14px;color:var(--ink);position:relative;min-height:32px}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--accent-soft);color:var(--ink);font-weight:550}
.nav .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .c{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav .more{opacity:0;width:24px;height:24px}
.nav:hover .more,.nav:focus-within .more,.nav.on .more{opacity:1}
.grp{padding:10px 8px 2px;color:var(--faint);font-size:12px}
.none{padding:6px 8px;color:var(--faint);font-size:13px}
.rail-foot{border-top:1px solid var(--line);padding:8px;display:flex;gap:4px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.rail-foot .nav{flex:1;justify-content:flex-start}

/* ---------- main ---------- */
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:54px;padding-top:max(10px,env(safe-area-inset-top,0px))}
.menu-btn{display:none}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.title h2{margin:0;font:600 15.5px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title input{flex:1;min-width:0;font:600 15.5px var(--sans);border:1px solid var(--accent);border-radius:7px;padding:3px 8px;background:var(--raise);outline:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 10px 4px 9px;font-size:13px;max-width:280px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--faint)}
.chip svg{width:14px;height:14px;flex:none}
.banner{background:var(--cite-soft);color:var(--cite);padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.banner code{font:12px var(--mono)}

.view{flex:1;display:flex;flex-direction:column;min-height:0}
.thread{flex:1;overflow:auto;padding:24px 24px 12px;overscroll-behavior:contain}
.inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.empty{max-width:600px;margin:7vh auto 0;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{font:500 27px/1.25 var(--serif);color:var(--ink);margin:0;text-wrap:balance}
.empty p{margin:0;max-width:52ch}
.suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;width:100%}
.suggest button{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13.5px;text-align:left;color:var(--ink);display:grid;gap:2px}
.suggest button small{color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest button:hover{border-color:var(--accent)}
.msg{display:flex;flex-direction:column;gap:12px}
.q{align-self:flex-end;max-width:85%;background:var(--accent);color:var(--accent-ink);padding:10px 15px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.readas{align-self:flex-end;font-size:12px;color:var(--faint);margin-top:-6px}
.a{display:flex;flex-direction:column;gap:12px}
.a .body{font:16.5px/1.68 var(--serif);overflow-wrap:anywhere}
.a .body p{margin:.5em 0} .a .body ul,.a .body ol{margin:.4em 0;padding-left:1.4em} .a .body li{margin:.2em 0}
.a .body h4{font:600 15.5px var(--sans);margin:1em 0 .3em}
.a .body code{font:13px var(--mono);background:var(--soft);padding:1px 5px;border-radius:4px}
.a .body pre{font:13px/1.5 var(--mono);background:var(--soft);padding:12px;border-radius:8px;overflow:auto}
.a .body table{border-collapse:collapse;font:14px var(--sans);display:block;overflow:auto}
.a .body td{border:1px solid var(--line);padding:4px 8px}
.cite{font:600 11px var(--sans);background:var(--cite-soft);color:var(--cite);border:0;border-radius:5px;padding:1px 5px;margin:0 1px;vertical-align:2px}
.cite:hover{text-decoration:underline}
.flag{font:600 12px var(--sans);color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:1px 6px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.flag svg,.check svg{width:13px;height:13px;flex:none}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.check{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;background:var(--ok-soft);color:var(--ok);font-weight:550}
.check.warn{background:var(--cite-soft);color:var(--cite)} .check.bad{background:var(--warn-soft);color:var(--warn)}
.route{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.acts{margin-left:auto;display:flex;gap:2px}
.acts .ib{width:28px;height:28px}
.acts .ib.on{background:var(--accent-soft);color:var(--accent)}
.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.src{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;align-items:start}
.src:hover{border-color:var(--accent)}
.src .n{font:600 11.5px var(--sans);color:var(--cite);background:var(--cite-soft);border-radius:5px;height:20px;display:grid;place-items:center}
.src .p{font-size:12.5px;line-height:1.4;overflow-wrap:anywhere;min-width:0}
.src .p .sl{font-weight:550;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src .p small{color:var(--faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src.flash{animation:flash 1s}
@keyframes flash{from{background:var(--cite-soft)}}
.err{color:var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:9px;font-size:14px}
.note{color:var(--muted);font-size:13px;font-style:italic}
.proc{border:1px solid var(--line);border-radius:10px;background:var(--panel);font:13px/1.45 var(--sans)}
.proc>summary{list-style:none;cursor:pointer;padding:7px 12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.proc>summary::-webkit-details-marker{display:none}
.proc>summary .chev{width:14px;height:14px;transition:transform .15s;transform:rotate(-90deg)}
.proc[open]>summary .chev{transform:none}
.proc>summary b{color:var(--ink);font-weight:550}
.steps{list-style:none;margin:0;padding:2px 12px 10px 14px;display:flex;flex-direction:column;gap:7px}
.st{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start}
.st .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:0;background:var(--ok-soft);color:var(--ok)}
.st .ic svg{width:11px;height:11px}
.st.run .ic{background:none;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st .tt{overflow-wrap:anywhere} .st .dd{color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.st ul{margin:3px 0 0;padding-left:14px;color:var(--muted);font-size:12.5px} .st li{margin:1px 0;overflow-wrap:anywhere}
.st .ms{color:var(--faint);font:11.5px var(--mono);white-space:nowrap}
.st.k-check .ic{background:var(--cite-soft);color:var(--cite)} .st.k-route .ic,.st.k-followup .ic,.st.k-decompose .ic{background:var(--accent-soft);color:var(--accent)}
.dots::after{content:"…";animation:dots 1.2s steps(3) infinite;display:inline-block;width:1.2em;overflow:hidden;vertical-align:bottom}
@keyframes dots{from{width:0}to{width:1.2em}}

.composer{padding:10px 24px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.box{max-width:780px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:15px/1.5 var(--sans);max-height:200px;padding:6px 4px;min-width:0}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:7px 16px;font-weight:600;flex:none}
.send.stop{background:var(--ink);color:var(--bg)}
.send:disabled{opacity:.45;cursor:default}
.opts{max-width:780px;margin:6px auto 0;display:flex;gap:14px;font-size:12px;color:var(--faint);flex-wrap:wrap;align-items:center}
.opts label{display:flex;gap:5px;align-items:center;color:var(--muted)}
.opts input{accent-color:var(--accent)}
.opts .hint{margin-left:auto}

/* ---------- library view ---------- */
.lib{flex:1;overflow:auto;padding:20px 24px 40px}
.lib-wrap{max-width:1040px;margin:0 auto;display:grid;gap:16px}
.lib-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lib-head h2{margin:0;font:600 22px var(--serif);flex:1;min-width:160px}
.lib-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lib-tools .search{margin:0;flex:1;min-width:200px}
.lib-tools select{border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:6px 8px;font-size:13.5px}
.folders{display:flex;gap:6px;flex-wrap:wrap}
.folders button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.folders button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:550}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;background:var(--panel);cursor:pointer}
.drop b{color:var(--ink)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13.5px}
.bulk b{margin-right:auto}
.dtable{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.drow{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 110px 34px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow.head{background:var(--soft);font-size:11.5px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px}
.drow input{accent-color:var(--accent);width:16px;height:16px}
.dname{font-weight:550;font-size:14px;overflow-wrap:anywhere;border:0;background:none;text-align:left;padding:0}
.dname:hover{text-decoration:underline}
.dsub{color:var(--faint);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.dfolder{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:5px;align-items:center}
.dfolder svg{width:13px;height:13px;flex:none}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;font-weight:550}
.pill.ready{background:var(--ok-soft);color:var(--ok)} .pill.processing,.pill.queued{background:var(--accent-soft);color:var(--accent)}
.pill.error{background:var(--warn-soft);color:var(--warn)} .pill.partial{background:var(--cite-soft);color:var(--cite)}
.bar{height:4px;background:var(--soft);border-radius:4px;margin-top:6px;overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.dmsg{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}

/* ---------- panel ---------- */
.panel{display:none;background:var(--panel);border-left:1px solid var(--line);min-height:0;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.panel-open .panel{display:flex}
.phead{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;flex:1}
.tabs button{background:none;border:0;border-radius:7px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--soft);color:var(--ink);font-weight:550}
.pbody{overflow:auto;padding:16px 18px 30px;flex:1}
.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ptitle{font:600 18px/1.3 var(--serif);margin:4px 0 2px;overflow-wrap:anywhere}
.cardbox{margin:12px 0;background:var(--card);border:1px solid var(--line);border-top:3px solid #c4555a;border-radius:4px;padding:10px 12px;font-size:13px}
.cardbox b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cardbox ul{margin:4px 0;padding-left:1.2em}
.srctext{white-space:pre-wrap;font:14.5px/1.65 var(--serif);overflow-wrap:anywhere}
.tree{list-style:none;padding-left:0;margin:6px 0;font-size:13.5px}
.tree ul{list-style:none;padding-left:16px;margin:0;border-left:1px solid var(--line)}
.tree button{background:none;border:0;padding:3px 6px;border-radius:5px;text-align:left;width:100%;display:flex;justify-content:space-between;gap:8px}
.tree button:hover{background:var(--soft)}
.tree small{color:var(--faint);white-space:nowrap}
.tl{list-style:none;margin:10px 0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:4px 0 8px 14px;font-size:13.5px;overflow-wrap:anywhere}
.tl li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl li.live::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.tl small{color:var(--faint);font:11.5px var(--mono);margin-right:6px}

/* ---------- menus, dialogs, toasts ---------- */
.pop{position:fixed;z-index:40;min-width:200px;max-width:min(300px,calc(100vw - 16px));background:var(--raise);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px}
.pop button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;font-size:13.5px}
.pop button:hover,.pop button:focus-visible{background:var(--soft)}
.pop button.danger{color:var(--warn)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pop svg{width:15px;height:15px;color:var(--muted)}
.pop button.danger svg{color:var(--warn)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--raise);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:min(86vh,760px);box-shadow:var(--shadow)}
dialog::backdrop{background:var(--scrim)}
dialog[open]{display:flex;flex-direction:column}
.dlg-h{display:flex;align-items:center;gap:8px;padding:16px 18px 8px}
.dlg-h h3{margin:0;font:600 17px var(--sans);flex:1}
.dlg-b{padding:4px 18px 12px;overflow:auto;display:grid;gap:12px;font-size:14px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;outline:0}
.field input[type=text]:focus{border-color:var(--accent)}
.checks{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;background:var(--bg)}
.checks .fh{padding:7px 12px 3px;font-size:11.5px;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.checks label{display:flex;gap:9px;align-items:center;padding:6px 12px;font-size:13.5px;cursor:pointer}
.checks label:hover{background:var(--soft)}
.checks label.dis{opacity:.5;cursor:default}
.checks input{accent-color:var(--accent);flex:none}
.checks span{flex:1;min-width:0;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;border-radius:7px;padding:4px 12px;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg svg{width:14px;height:14px}
.seg button.on{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.kv code{font:12px var(--mono)}
.ok{color:var(--ok);font-weight:600} .no{color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:11px;padding:9px 10px 9px 14px;display:flex;gap:12px;align-items:center;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:650;padding:3px 6px;border-radius:6px}
:root[data-theme="dark"] .toast button{color:var(--accent-ink)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .app.panel-open{grid-template-columns:272px minmax(0,1fr)}
  .panel-open .panel{position:fixed;inset:0 0 0 auto;width:min(440px,100vw);z-index:35;box-shadow:var(--shadow)}
}
@media (max-width:767px){
  .app,.app.panel-open{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:36;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .rail-close{display:inline-grid}
  .newchat kbd{display:none}
  .menu-btn{display:inline-grid}
  .top{padding-left:8px;padding-right:8px;gap:4px;flex-wrap:wrap}
  .title{order:0}
  .chip{order:2;max-width:100%;flex-basis:100%;justify-content:flex-start;margin:2px 4px 0}
  .thread{padding:16px 14px 8px}
  .composer{padding:8px 10px 10px}
  .opts .hint{display:none}
  .suggest{grid-template-columns:minmax(0,1fr)}
  .q{max-width:92%}
  .panel-open .panel{width:100vw}
  .lib{padding:14px 12px 30px}
  .drow{grid-template-columns:24px minmax(0,1fr) 34px;row-gap:4px}
  .drow .dfolder,.drow .dstat{grid-column:2}
  .drow .nof{display:none}
  .drow.head{display:none}
  .sources{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Projects and chats">
    <div class="brand"><span class="logo" aria-hidden="true"><svg><use href="#i-book-open-text"/></svg></span><h1>Document Cortex</h1>
      <button class="ib rail-close" id="railClose" type="button" aria-label="Close sidebar"><svg><use href="#i-x"/></svg></button></div>
    <button class="btn newchat" id="newChat" type="button"><span><svg><use href="#i-message-square-plus"/></svg>New chat</span><kbd>⇧⌘O</kbd></button>
    <div class="search"><svg><use href="#i-search"/></svg><input id="chatSearch" type="search" placeholder="Search chats" aria-label="Search chats"></div>
    <div class="rail-scroll">
      <div class="sec"><span>Projects</span><button class="ib" id="addProject" type="button" title="New project" aria-label="New project"><svg><use href="#i-plus"/></svg></button></div>
      <div id="projects"></div>
      <div class="sec"><span id="chatsLabel">Chats</span></div>
      <div id="chats"></div>
    </div>
    <div class="rail-foot">
      <button class="nav" id="goLibrary" type="button"><svg><use href="#i-books"/></svg><span class="t">Library</span><span class="c" id="docCount"></span></button>
      <button class="nav" id="goSettings" type="button" style="flex:none;width:auto" aria-label="Settings" title="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
  </aside>

  <main>
    <header class="top">
      <button class="ib menu-btn" id="openRail" type="button" aria-label="Open sidebar"><svg><use href="#i-menu"/></svg></button>
      <div class="title" id="title"><h2 id="titleText">New chat</h2></div>
      <button class="chip" id="scopeChip" type="button" title="Choose which documents this chat searches"><svg><use href="#i-scope"/></svg><span>Searching</span><b id="scopeText">all documents</b><svg><use href="#i-caret"/></svg></button>
      <button class="ib" id="chatMenu" type="button" aria-label="Chat options"><svg><use href="#i-dots"/></svg></button>
    </header>
    <div id="keyBanner" class="banner" hidden>No Groq API key found. Put <code>GROQ_API_KEY=…</code> in <code>~/.cortex/.env</code> and restart <code>cortex serve</code>. A free key: console.groq.com/keys</div>

    <section class="view" id="chatView">
      <div class="thread" id="thread"><div class="inner" id="inner"></div></div>
      <div class="composer">
        <form class="box" id="form">
          <button class="ib" id="attach" type="button" title="Add documents" aria-label="Add documents"><svg><use href="#i-clip"/></svg></button>
          <textarea id="q" rows="1" placeholder="Ask anything about your documents…" aria-label="Question"></textarea>
          <button class="send" id="send" type="submit">Ask</button>
        </form>
        <div class="opts"><label><input type="checkbox" id="verify" checked> Check citations</label><span id="scopeHint"></span><span class="hint">Enter to ask · Shift+Enter new line</span></div>
      </div>
    </section>

    <section class="view" id="libView" hidden>
      <div class="lib"><div class="lib-wrap">
        <div class="lib-head"><h2 id="libCount">Documents</h2>
          <button class="btn primary" id="uploadBtn" type="button"><svg><use href="#i-upload"/></svg>Add documents</button></div>
        <label class="drop" id="drop" tabindex="0"><b>Drop files here</b> or click to choose · PDF (scanned too), Word, Markdown, text, images · any language</label>
        <div class="lib-tools">
          <div class="search"><svg><use href="#i-search"/></svg><input id="docSearch" type="search" placeholder="Search documents" aria-label="Search documents"></div>
          <select id="statusFilter" aria-label="Filter by status"><option value="">Any status</option><option value="ready">Ready</option><option value="processing">Processing</option><option value="error">Failed</option></select>
        </div>
        <div class="folders" id="folders"></div>
        <div class="bulk" id="bulk" hidden></div>
        <div class="dtable" id="dtable"></div>
      </div></div>
    </section>
  </main>

  <aside class="panel" id="panel" aria-label="Source panel">
    <div class="phead">
      <div class="tabs"><button id="tabSrc" class="on" type="button">Source</button><button id="tabOut" type="button">Outline</button><button id="tabProc" type="button">Process</button></div>
      <button class="ib" id="closePanel" type="button" aria-label="Close panel"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>
<input type="file" id="file" multiple hidden accept=".pdf,.docx,.md,.markdown,.txt,.rst,.png,.jpg,.jpeg,.tif,.tiff,.webp,.bmp">
<div class="scrim" id="scrim" hidden></div>
<div class="pop" id="pop" hidden role="menu"></div>
<dialog id="dlg"><div class="dlg-h"><h3 id="dlgTitle"></h3><button class="ib" type="button" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button></div><div class="dlg-b" id="dlgBody"></div><div class="dlg-f" id="dlgFoot"></div></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = n => `<svg><use href="#i-${n}"/></svg>`;
const store = {get(k, d) { try { const v = localStorage.getItem("cortex." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
               set(k, v) { try { localStorage.setItem("cortex." + k, JSON.stringify(v)); } catch {} }};
const S = {docs: [], projects: [], chats: [], project: store.get("project", ""), chat: null, draftDocs: null,
           view: "chat", busy: false, abort: null, status: null, folder: "", libSel: new Set(), outlineDoc: null, procDoc: null, lastSrc: null};
const COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#6250d6", "#e34948", "#008300"];

async function api(path, opts = {}) {
  if (opts.json !== undefined) { opts.body = JSON.stringify(opts.json); opts.headers = {"Content-Type": "application/json"}; delete opts.json; }
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
}

/* ---------- theme ---------- */
function applyTheme() { const t = store.get("theme", "system"); if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; }
applyTheme();
$("#verify").checked = store.get("verify", true);

/* ---------- helpers ---------- */
const pages = p => !p ? "" : (p[0] === p[1] ? `p. ${p[0]}` : `p. ${p[0]}–${p[1]}`);
const ready = () => S.docs.filter(d => d.status === "ready" || d.status === "partial");
const docName = d => d.title || d.name || d.slug;
const docBy = slug => S.docs.find(d => d.slug === slug);
const proj = id => S.projects.find(p => p.id === id);
const projColor = p => COLORS[Math.abs([...p.id].reduce((a, c) => a * 31 + c.charCodeAt(0), 7)) % COLORS.length];
function scopeSlugs() {
  const r = new Set(ready().map(d => d.slug));
  const explicit = S.chat ? S.chat.docs : S.draftDocs;
  if (explicit && explicit.length) return explicit.filter(s => r.has(s));
  const p = proj(S.chat ? S.chat.project : S.project);
  if (p) return p.docs.filter(s => r.has(s));
  return [...r];
}
function scopeLabel() {
  const s = scopeSlugs(), explicit = S.chat ? S.chat.docs : S.draftDocs, p = proj(S.chat ? S.chat.project : S.project);
  if (explicit && explicit.length) return s.length === 1 ? docName(docBy(s[0]) || {slug: s[0]}) : `${s.length} chosen documents`;
  if (p) return `${p.name} · ${s.length} doc${s.length === 1 ? "" : "s"}`;
  return `all ${s.length} documents`;
}
function toast(msg, undo, ms = 5000) {
  const t = $("#toast"); clearTimeout(toast.t);
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" id="undo">Undo</button>` : ""}`; t.hidden = false;
  return new Promise(res => {
    if (undo) $("#undo").onclick = () => { t.hidden = true; clearTimeout(toast.t); res(false); };
    toast.t = setTimeout(() => { t.hidden = true; res(true); }, ms);
  });
}

/* ---------- menus & dialogs ---------- */
function menu(anchor, items) {
  const pop = $("#pop");
  pop.innerHTML = items.map((it, i) => it === "-" ? "<hr>" : `<button type="button" role="menuitem" data-i="${i}" class="${it.danger ? "danger" : ""}">${it.icon ? icon(it.icon) : ""}${esc(it.label)}</button>`).join("");
  pop.hidden = false;
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  pop.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
  pop.onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; closeMenu(); items[+b.dataset.i].action(); };
  pop.querySelector("button")?.focus();
}
function closeMenu() { $("#pop").hidden = true; }
document.addEventListener("pointerdown", e => { if (!$("#pop").hidden && !e.target.closest("#pop")) closeMenu(); }, true);

function dialog(title, body, buttons) {
  const d = $("#dlg"); $("#dlgTitle").textContent = title; $("#dlgBody").innerHTML = body;
  $("#dlgFoot").innerHTML = buttons.map((b, i) => `<button type="button" class="btn ${b.cls || ""}" data-b="${i}">${esc(b.label)}</button>`).join("");
  $("#dlgFoot").onclick = async e => { const b = e.target.closest("[data-b]"); if (!b) return; const r = await buttons[+b.dataset.b].action?.(); if (r !== false) d.close(); };
  d.showModal(); d.querySelector("input[type=text]")?.focus();
  return d;
}
$("#dlg").addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target === $("#dlg")) $("#dlg").close(); });
function confirmDlg(title, text, label, action) { dialog(title, `<p style="margin:0">${text}</p>`, [{label: "Cancel"}, {label, cls: "danger solid", action}]); }
function promptDlg(title, label, value, action, hint = "") {
  dialog(title, `<div class="field"><label for="pv">${esc(label)}</label><input type="text" id="pv" value="${esc(value)}">${hint ? `<span class="path">${hint}</span>` : ""}</div>`,
    [{label: "Cancel"}, {label: "Save", cls: "primary", action: () => action($("#pv").value)}]);
  $("#pv").select(); $("#pv").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#dlgFoot [data-b='1']").click(); } };
}
function docChecklist(checked, {onlyReady = true} = {}) {
  const groups = {};
  S.docs.forEach(d => (groups[d.folder || ""] ||= []).push(d));
  const keys = Object.keys(groups).sort((a, b) => (a === "") - (b === "") || a.localeCompare(b));
  if (!S.docs.length) return `<p class="path">No documents yet. Add some in the Library.</p>`;
  return `<div class="checks">${keys.map(k => `${keys.length > 1 ? `<div class="fh">${esc(k || "No folder")}</div>` : ""}` + groups[k].map(d => {
    const ok = d.status === "ready" || d.status === "partial";
    return `<label class="${ok || !onlyReady ? "" : "dis"}"><input type="checkbox" value="${esc(d.slug)}" ${checked.has(d.slug) ? "checked" : ""} ${ok || !onlyReady ? "" : "disabled"}><span>${esc(docName(d))}</span>${ok ? "" : `<span class="pill ${esc(d.status)}">${esc(d.status)}</span>`}</label>`;
  }).join("")).join("")}</div>`;
}
const checkedIn = () => [...$("#dlgBody").querySelectorAll(".checks input:checked")].map(i => i.value);

/* ---------- sidebar ---------- */
function renderProjects() {
  const all = `<button class="nav ${S.project === "" ? "on" : ""}" data-proj=""><span class="dot" style="background:var(--faint)"></span><span class="t">All documents</span><span class="c">${ready().length}</span></button>`;
  $("#projects").innerHTML = all + S.projects.map(p => `<div class="nav ${S.project === p.id ? "on" : ""}" role="button" tabindex="0" data-proj="${p.id}">
    <span class="dot" style="background:${projColor(p)}"></span><span class="t">${esc(p.name)}</span><span class="c">${p.docs.length}</span>
    <button class="ib more" type="button" data-projmenu="${p.id}" aria-label="Project options"><svg><use href="#i-dots"/></svg></button></div>`).join("")
    + (S.projects.length ? "" : `<div class="none">Group documents and their chats, e.g. one per course or case.</div>`);
}
function renderChats() {
  const q = $("#chatSearch").value.trim().toLowerCase();
  let list = S.chats.filter(c => (S.project === "" || c.project === S.project) && (!q || (c.title || "").toLowerCase().includes(q)));
  $("#chatsLabel").textContent = S.project ? `Chats in ${proj(S.project)?.name || "project"}` : "All chats";
  if (!list.length) { $("#chats").innerHTML = `<div class="none">${q ? "No chats match." : "No chats yet. Ask a question to start one."}</div>`; return; }
  const now = Date.now(), day = 864e5, groups = {Pinned: [], Today: [], "Previous 7 days": [], Older: []};
  list.forEach(c => { const age = now - new Date(c.updated).getTime();
    (c.pinned ? groups.Pinned : age < day && new Date(c.updated).toDateString() === new Date().toDateString() ? groups.Today : age < 7 * day ? groups["Previous 7 days"] : groups.Older).push(c); });
  $("#chats").innerHTML = Object.entries(groups).filter(([, v]) => v.length).map(([k, v]) => `<div class="grp">${k}</div>` + v.map(c =>
    `<div class="nav ${S.chat?.id === c.id ? "on" : ""}" role="button" tabindex="0" data-chat="${c.id}"><span class="t">${esc(c.title || "Untitled chat")}</span>
      <button class="ib more" type="button" data-chatmenu="${c.id}" aria-label="Chat options"><svg><use href="#i-dots"/></svg></button></div>`).join("")).join("");
}
async function loadSide() {
  try { [S.projects, S.chats] = await Promise.all([api("/api/projects"), api("/api/chats")]); } catch { return; }
  if (S.project && !proj(S.project)) S.project = "";
  renderProjects(); renderChats();
}
function closeRail() { $("#rail").classList.remove("open"); $("#scrim").hidden = true; }

/* ---------- header & scope ---------- */
function renderHeader() {
  $("#titleText").textContent = S.view === "library" ? "Library" : (S.chat?.title || "New chat");
  $("#scopeChip").hidden = S.view === "library";
  $("#chatMenu").hidden = S.view === "library" || !S.chat;
  $("#scopeText").textContent = scopeLabel();
  const n = scopeSlugs().length;
  const pp = proj(S.chat ? S.chat.project : S.project), ex = S.chat ? S.chat.docs : S.draftDocs;
  $("#q").placeholder = !n ? "Add a document to start…" : ex && ex.length === 1 ? `Ask about ${docName(docBy(ex[0]) || {slug: ex[0]})}…`
    : pp && !(ex && ex.length) ? `Ask about ${pp.name}…` : "Ask a question…";
  $("#scopeHint").textContent = "";
}
function openScope() {
  const cur = new Set(scopeSlugs()), p = proj(S.chat ? S.chat.project : S.project);
  dialog("Documents this chat searches", `<p class="path" style="margin:0">Answers come only from the ticked documents.</p>
    <div class="lib-tools"><button class="btn" type="button" id="selAllD">Select all</button><button class="btn" type="button" id="selNoneD">Clear</button></div>${docChecklist(cur)}`,
    [{label: p ? `Use ${p.name}` : "Use all documents", action: () => setScope(null)}, {label: "Apply", cls: "primary", action: () => setScope(checkedIn())}]);
  $("#selAllD").onclick = () => $("#dlgBody").querySelectorAll(".checks input:not(:disabled)").forEach(i => i.checked = true);
  $("#selNoneD").onclick = () => $("#dlgBody").querySelectorAll(".checks input").forEach(i => i.checked = false);
}
async function setScope(list) {
  const all = ready().map(d => d.slug), p = proj(S.chat ? S.chat.project : S.project);
  const base = p ? p.docs.filter(s => all.includes(s)) : all;
  if (list && (!list.length || (list.length === base.length && list.every(s => base.includes(s))))) list = null;
  if (S.chat) { S.chat.docs = list; await api(`/api/chats/${S.chat.id}`, {method: "PATCH", json: {docs: list || []}}).catch(() => {}); }
  else S.draftDocs = list;
  renderHeader(); if (!S.chat || !S.chat.messages.length) renderEmpty();
}

/* ---------- chats ---------- */
function newChat(scope = null) {
  if (S.abort) return;
  const p = proj(S.project);  // documents outside the selected project: start the chat outside it
  if (scope && p && !scope.every(d => p.docs.includes(d))) { S.project = ""; store.set("project", ""); renderProjects(); }
  S.chat = null; S.draftDocs = scope; showView("chat"); location.hash = "";
  renderHeader(); renderEmpty(); renderChats(); closeRail(); $("#q").focus();
}
async function openChat(id) {
  try { S.chat = await api(`/api/chats/${id}`); } catch { toast("That chat no longer exists."); return newChat(); }
  if (!Array.isArray(S.chat.docs) || !S.chat.docs.length) S.chat.docs = null;
  if (S.chat.project && S.project && S.chat.project !== S.project) { S.project = S.chat.project; store.set("project", S.project); renderProjects(); }
  showView("chat"); if (location.hash !== "#chat=" + id) history.replaceState(null, "", "#chat=" + id);
  renderHeader(); renderThread(); renderChats(); closeRail();
}
function renderThread() {
  const inner = $("#inner"); inner.innerHTML = "";
  if (!S.chat || !S.chat.messages.length) return renderEmpty();
  S.chat.messages.forEach((m, i) => inner.appendChild(renderMessage(m, i)));
  requestAnimationFrame(() => { const t = $("#thread"); t.scrollTop = t.scrollHeight; });
}
async function renderEmpty() {
  if (S.chat && S.chat.messages.length) return;
  const r = ready(), slugs = scopeSlugs(), p = proj(S.chat ? S.chat.project : S.project);
  const inner = $("#inner");
  if (!S.docs.length) {
    inner.innerHTML = `<div class="empty"><h2>Put in a document, then ask anything about it</h2>
      <p>PDFs (scanned books too), handwritten notes, Word files, Markdown or plain text, in any language. Each is read, organised into sections with index cards, and indexed on this computer.</p>
      <button class="btn primary" type="button" data-upload>${icon("upload")}Add documents</button></div>`; return;
  }
  inner.innerHTML = `<div class="empty"><h2>${p ? esc(p.name) : "Ask anything about your documents"}</h2>
    <p>${slugs.length ? `Searching ${esc(scopeLabel())}. Answers cite the exact section and page, and every citation is checked against its source.`
      : r.length ? "This project has no ready documents yet. Add some from the Library, or choose documents above." : "Your documents are still being read. Watch their progress in the Library."}</p>
    <div class="suggest" id="sugg"></div></div>`;
  if (!slugs.length) return;
  try {
    const sg = await api("/api/suggest?docs=" + encodeURIComponent(slugs.slice(0, 12).join(",")));
    const el = $("#sugg"); if (!el) return;
    el.innerHTML = sg.map(s => `<button type="button" data-ask="${esc(s.question)}">${esc(s.question)}<small>${esc(docName(docBy(s.doc) || {slug: s.doc}))}</small></button>`).join("");
  } catch {}
}
function renderMessage(m, i) {
  const w = document.createElement("div"); w.className = "msg"; w.dataset.i = i;
  w.innerHTML = `<div class="q">${esc(m.question)}</div>${m.standalone ? `<div class="readas">Read as: ${esc(m.standalone)}</div>` : ""}`;
  w.appendChild(renderAnswer(m.result, i));
  return w;
}

/* ---------- markdown (escaped first, then a small safe subset) ---------- */
function md(src, n) {
  return String(src).split(/```/).map((b, i) => {
    if (i % 2) return `<pre>${esc(b.replace(/^\w*\n/, ""))}</pre>`;
    const lines = esc(b).split("\n"); let out = "", list = null;
    const close = () => { if (list) { out += `</${list}>`; list = null; } };
    for (const l of lines) {
      let m;
      if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1], n)}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1], n)}</li>`; }
      else if ((m = l.match(/^#{1,6}\s+(.*)/))) { close(); out += `<h4>${inline(m[1], n)}</h4>`; }
      else if (/^\s*\|.*\|\s*$/.test(l)) { close(); if (!/^\s*\|[\s:|-]+\|\s*$/.test(l)) out += `<table><tr>${l.trim().slice(1, -1).split("|").map(c => `<td>${inline(c.trim(), n)}</td>`).join("")}</tr></table>`; }
      else if (!l.trim()) close();
      else { close(); out += `<p>${inline(l, n)}</p>`; }
    }
    close(); return out.replace(/<\/table><table>/g, "");
  }).join("");
}
function inline(s, n) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\s][^*]*)\*(?=\W|$)/g, "$1<em>$2</em>")
    .replace(/⚠ (not found in the sources|partly supported)/g, '<span class="flag"><svg><use href="#i-triangle-alert"/></svg>$1</span>')
    .replace(/\[(\d+)\]/g, (m, d) => (+d >= 1 && +d <= n) ? `<button class="cite" type="button" data-cite="${d}">${d}</button>` : m);
}
function stepHTML(st) {
  const ic = st.running ? "" : icon({route: "signpost", followup: "messages-square", decompose: "split", check: "shield-check", answer: "pen-line", search: "search", rank: "list-ordered", sources: "file-text", entities: "tags", load: "database", quota: "key-round", select: "crosshair"}[st.kind] || "check");
  const time = st.running ? "" : st.ms != null ? (st.ms >= 1000 ? (st.ms / 1000).toFixed(1) + "s" : st.ms + "ms") : (st.t != null ? st.t + "s" : "");
  return `<li class="st k-${esc(st.kind)}${st.running ? " run" : ""}" data-kind="${esc(st.kind)}"><span class="ic">${ic}</span>
    <div><div class="tt">${esc(st.title)}</div>${st.detail ? `<div class="dd">${esc(st.detail)}</div>` : ""}
    ${(st.items || []).length ? `<ul>${st.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div><span class="ms">${time}</span></li>`;
}
function checkBadge(c) {
  if (!c) return "";
  if (c.error) return `<span class="check warn">${icon("triangle-alert")}Citation check unavailable</span>`;
  const n = c.supported + c.partial + c.recited + c.unsupported;
  if (!n) return `<span class="check warn">${icon("triangle-alert")}No cited claims to check</span>`;
  const parts = [`${c.supported}/${n} supported`];
  if (c.partial) parts.push(`${c.partial} partly`); if (c.recited) parts.push(`${c.recited} re-cited`); if (c.unsupported) parts.push(`${c.unsupported} not in sources`); if (c.unchecked) parts.push(`${c.unchecked} unchecked`);
  return `<span class="check ${c.unsupported ? "bad" : c.partial + c.recited ? "warn" : ""}" title="Each cited sentence was checked against its source">${icon(c.unsupported || c.partial ? "triangle-alert" : "circle-check")}${parts.join(" · ")}</span>`;
}
function srcLabel(s, multi) {
  const parts = s.path.split(" › "), last = parts.length > 1 ? parts[parts.length - 1] : (s.doc_name || parts[0]);
  const parent = parts.slice(1, -1).join(" › "), where = [multi ? s.doc_name : "", parent].filter(Boolean).join(" › ");
  return `<b class="sl">${esc(last)}</b><small>${esc(where || (parts.length > 1 ? "" : "whole document"))}${s.pages ? `${where ? " · " : ""}${pages(s.pages)}` : ""}</small>`;
}
function renderAnswer(res, i) {
  const el = document.createElement("div"); el.className = "a"; el.dataset.id = res.id; el._res = res;
  const multi = new Set(res.sources.map(s => s.doc)).size > 1, steps = res.trace || [];
  const total = steps.reduce((a, s) => a + (s.ms || 0), 0);
  el.innerHTML = `${steps.length ? `<details class="proc"><summary><svg class="chev"><use href="#i-caret"/></svg><b>Process</b> · ${steps.length} steps${total ? ` · ${(total / 1000).toFixed(1)}s` : ""}</summary><ol class="steps">${steps.map(stepHTML).join("")}</ol></details>` : ""}
    <div class="body">${md(res.answer, res.sources.length)}</div>
    <div class="meta">${checkBadge(res.check)}${res.route === "overview" ? `<span class="route">overview</span>` : ""}
      <div class="acts">
        <button class="ib" type="button" data-copy title="Copy answer" aria-label="Copy answer">${icon("copy")}</button>
        ${i != null ? `<button class="ib" type="button" data-retry="${i}" title="Ask again" aria-label="Ask again">${icon("retry")}</button>` : ""}
        <button class="ib ${res.feedback === 1 ? "on" : ""}" type="button" data-fb="1" title="Good answer" aria-label="Good answer">${icon("up")}</button>
        <button class="ib ${res.feedback === -1 ? "on" : ""}" type="button" data-fb="-1" title="Bad answer" aria-label="Bad answer">${icon("down")}</button></div></div>
    ${res.sources.length ? `<div class="sources">${res.sources.map((s, k) => `<button type="button" class="src" data-src="${k}"><span class="n">${k + 1}</span>
      <span class="p">${srcLabel(s, multi)}</span></button>`).join("")}</div>` : ""}`;
  return el;
}

/* ---------- asking ---------- */
async function ask(question, replace = null) {
  question = question.trim(); if (!question || S.busy) return;
  const slugs = scopeSlugs();
  if (!slugs.length) { toast(ready().length ? "No documents chosen for this chat. Pick some with the Searching button." : "Add a document first, and wait until it shows “ready”."); return; }
  if (!S.chat || !S.chat.messages.length) $("#inner").innerHTML = "";
  if (replace != null) $(`#inner .msg[data-i="${replace}"]`)?.remove();
  S.busy = true; S.abort = new AbortController(); setSend();
  const w = document.createElement("div"); w.className = "msg";
  w.innerHTML = `<div class="q">${esc(question)}</div><div class="a"><details class="proc" open><summary><svg class="chev"><use href="#i-caret"/></svg><b>Working</b><span class="dots"></span></summary><ol class="steps"></ol></details></div>`;
  $("#inner").appendChild(w); const t = $("#thread"); t.scrollTop = t.scrollHeight;
  const list = w.querySelector(".steps");
  const addStep = st => { const run = list.querySelector(`.st.run[data-kind="${CSS.escape(st.kind)}"]`); const h = stepHTML(st);
    if (run) run.outerHTML = h; else list.insertAdjacentHTML("beforeend", h); if (t.scrollHeight - t.scrollTop - t.clientHeight < 200) t.scrollTop = t.scrollHeight; };
  const all = ready().map(d => d.slug);
  let chatId = S.chat?.id || null;
  try {
    const r = await fetch("/api/ask/stream", {method: "POST", headers: {"Content-Type": "application/json"}, signal: S.abort.signal,
      body: JSON.stringify({question, docs: slugs.length === all.length ? null : slugs, verify: $("#verify").checked,
                            chat_id: chatId, project: S.chat ? null : S.project || null, replace,
                            chat_docs: S.chat ? null : (S.draftDocs && S.draftDocs.length ? S.draftDocs : null)})});
    if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", result = null;
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true}); let k;
      while ((k = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, k); buf = buf.slice(k + 1); if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "chat") { chatId = ev.chat_id; if (!S.chat) { history.replaceState(null, "", "#chat=" + chatId); } }
        else if (ev.type === "step") addStep(ev);
        else if (ev.type === "result") result = ev;
        else if (ev.type === "error") throw new Error(ev.message);
      }
    }
    if (!result) throw new Error("No answer came back.");
    S.chat = await api(`/api/chats/${chatId}`); if (!S.chat.docs?.length) S.chat.docs = null;
    renderThread(); renderHeader(); loadSide();
  } catch (e) {
    const stopped = e.name === "AbortError";
    w.querySelector("summary").innerHTML = `<svg class="chev"><use href="#i-caret"/></svg><b>Process</b> · ${stopped ? "stopped" : "failed"}`;
    w.querySelector(".a").insertAdjacentHTML("beforeend", stopped ? `<p class="note">Stopped. The answer may still be saved to this chat when it finishes.</p>` : `<div class="err">${esc(e.message)}</div>`);
    if (chatId && !S.chat) { try { S.chat = await api(`/api/chats/${chatId}`); } catch {} loadSide(); renderHeader(); }
  }
  S.busy = false; S.abort = null; setSend();
}
function setSend() { const b = $("#send"); b.textContent = S.busy ? "Stop" : "Ask"; b.classList.toggle("stop", S.busy); b.type = S.busy ? "button" : "submit"; }

  }
  else if (d.copy !== undefined) { const r = t.closest(".a")._res;
    const txt = r.answer + (r.sources.length ? "\n\nSources:\n" + r.sources.map((s, i) => `[${i + 1}] ${s.doc_name} › ${s.path}${s.pages ? " (" + pages(s.pages) + ")" : ""}`).join("\n") : "");
    try { await navigator.clipboard.writeText(txt); toast("Answer copied", false, 1800); } catch { toast("Copy is not available here."); } }
  else if (d.retry !== undefined) { const m = S.chat?.messages[+d.retry]; if (m) ask(m.question, +d.retry); }
  else if (d.fb) { const a = t.closest(".a"), v = +d.fb;
    await api("/api/feedback", {method: "POST", json: {id: a.dataset.id, value: v}}).catch(() => {});
    a._res.feedback = v; a.querySelectorAll("[data-fb]").forEach(b => b.classList.toggle("on", b === t));
    if (v === 1) toast("Thanks. “Learn from liked answers” in Settings teaches this to the index.", false, 3000); }
});
document.addEventListener("keydown", e => {
  const t = e.target.closest?.("[data-chat],[data-proj]");
  if (t && (e.key === "Enter" || e.key === " ") && e.target === t) { e.preventDefault(); t.click(); }
});
document.addEventListener("change", e => { const s = e.target.dataset.lsel; if (s) { e.target.checked ? S.libSel.add(s) : S.libSel.delete(s); renderLibrary(); } });
$("#newChat").onclick = () => newChat();
$("#addProject").onclick = () => projectDialog();
$("#chatSearch").oninput = renderChats;
$("#goLibrary").onclick = () => { showView("library"); closeRail(); };
$("#goSettings").onclick = () => { openSettings(); closeRail(); };
$("#openRail").onclick = () => { $("#rail").classList.add("open"); $("#scrim").hidden = false; };
$("#railClose").onclick = closeRail;
$("#scrim").onclick = closeRail;
$("#scopeChip").onclick = openScope;
$("#chatMenu").onclick = e => S.chat && menu(e.currentTarget, chatItems(S.chat.id));
$("#titleText").ondblclick = () => S.chat && S.view === "chat" && promptDlg("Rename chat", "Name", S.chat.title || "", v => patchChat(S.chat.id, {title: v}));
$("#closePanel").onclick = closePanel;
$("#tabOut").onclick = () => { const d = S.outlineDoc || S.lastSrc?.slug || ready()[0]?.slug; if (d) showOutline(d); };
$("#tabSrc").onclick = () => { if (S.lastSrc) showNode(S.lastSrc.slug, S.lastSrc.id); else $("#pbody").innerHTML = `<p class="path">Click a citation like [1] in an answer to see its source here.</p>`, openPanel("src"); };
$("#tabProc").onclick = () => { const d = S.procDoc || S.outlineDoc || S.lastSrc?.slug || S.docs[0]?.slug; if (d) showProcess(d); };
$("#verify").onchange = e => store.set("verify", e.target.checked);
$("#attach").onclick = () => $("#file").click();
$("#uploadBtn").onclick = () => $("#file").click();
$("#file").onchange = e => { upload(e.target.files); e.target.value = ""; };
$("#docSearch").oninput = renderLibrary; $("#statusFilter").onchange = renderLibrary;
const drop = $("#drop");
drop.onclick = () => $("#file").click();
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#file").click(); } });
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => upload(e.dataTransfer.files));
// files dropped anywhere on the chat go to the library too
$("#chatView").addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
$("#chatView").addEventListener("drop", e => { if (e.dataTransfer.files.length) { e.preventDefault(); upload(e.dataTransfer.files); } });
const q = $("#q");
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#form").requestSubmit(); } });
$("#form").onsubmit = e => { e.preventDefault(); if (S.busy) return; const v = q.value; if (!v.trim()) return; q.value = ""; q.style.height = "auto"; ask(v); };
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); if (innerWidth < 768) $("#openRail").click(); $("#chatSearch").focus(); }
  else if (mod && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); newChat(); }
  else if (e.key === "Escape") { if (!$("#pop").hidden) closeMenu(); else if ($("#rail").classList.contains("open")) closeRail(); else if ($("#app").classList.contains("panel-open")) closePanel(); }
  else if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$("#dlg").open) { e.preventDefault(); showView("chat"); q.focus(); }
});
window.addEventListener("hashchange", route);
function route() {
  const h = location.hash;
  if (h.startsWith("#chat=")) openChat(h.slice(6));
  else if (h === "#library") showView("library");
}

(async () => {
  try { S.status = await api("/api/status"); $("#keyBanner").hidden = S.status.keys.GROQ_API_KEY || S.status.keys.GROQ_PAID_API_KEY; } catch {}
  await Promise.all([loadSide(), loadDocs()]);
  if (location.hash) route(); else { renderHeader(); renderEmpty(); }
})();
</script>
</body>
</html>
